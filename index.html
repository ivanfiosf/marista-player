<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Player de vídeo · Apresentações Marista</title>
<style>
  html, body { margin: 0; height: 100%; background: #001B2E; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #B9C8D8; font: 16px/1.4 system-ui, sans-serif; text-align: center; margin-top: 40vh; padding: 0 1em; }
</style>
</head>
<body>
<script>
  // Player das apresentações Marista: recebe ?v=<id do YouTube>&start=<segundos> e mostra o vídeo.
  // Existe porque o YouTube só toca vídeos incorporados em páginas com endereço https; a apresentação,
  // aberta direto do computador, coloca esta página dentro do slide.
  (function () {
    var q = new URLSearchParams(location.search);
    var v = q.get('v') || '', ini = parseInt(q.get('start') || '0', 10) || 0;
    if (!/^[\w-]{11}$/.test(v)) { document.body.innerHTML = '<p>Vídeo não informado.</p>'; return; }
    var src = 'https://www.youtube-nocookie.com/embed/' + v + '?autoplay=' + (q.get('autoplay') === '0' ? 0 : 1) +
      '&rel=0&modestbranding=1&playsinline=1&fs=1' + (ini ? '&start=' + ini : '') + '&origin=' + encodeURIComponent(location.origin);
    var f = document.createElement('iframe');
    f.src = src; f.title = 'Vídeo'; f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; web-share'; f.allowFullscreen = true;
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
